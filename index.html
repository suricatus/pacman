<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#12051d">
    <title>Pacman Customizado | Suricatus Games</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>

      <!-- Tela de carregamento com a marca. Fica por cima do canvas ate o jogo
           estar pronto, e some sozinha. -->
      <div id="suricatus-loading">
        <img id="suricatus-logo" src="TemplateData/logo.png" alt="Suricatus Games">
        <p id="suricatus-texto">Carregando o jogo…</p>
        <div id="suricatus-barra"><div id="suricatus-barra-cheia"></div></div>
        <p id="suricatus-porcento">0%</p>
        <p id="suricatus-erro"></p>
      </div>

      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");
      var telaCarregando = document.querySelector("#suricatus-loading");
      var barraCheia = document.querySelector("#suricatus-barra-cheia");
      var textoPorcento = document.querySelector("#suricatus-porcento");
      var textoCarregando = document.querySelector("#suricatus-texto");
      var textoErro = document.querySelector("#suricatus-erro");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // --- Area do jogo em retrato -------------------------------------------
      // O jogo foi desenhado para um totem 9:16 e as telas dele tem tamanho fixo
      // de 1080x1920. A area do jogo fica sempre em 9:16, centralizada: em tela
      // mais larga (computador, tablet deitado) sobram faixas nas laterais, e em
      // celular mais comprido que 9:16 sobram faixas em cima e embaixo. Sem a
      // trava na altura, o fundo nao cobria a tela e os textos cortavam nas bordas.
      var PROPORCAO = 9 / 16;

      function ajustarAreaDoJogo() {
        var largura = container.clientWidth;
        var altura = container.clientHeight;
        var larguraDoJogo = Math.min(largura, Math.floor(altura * PROPORCAO));
        var alturaDoJogo = Math.min(altura, Math.floor(larguraDoJogo / PROPORCAO));
        canvas.style.width = larguraDoJogo + "px";
        canvas.style.height = alturaDoJogo + "px";
      }

      window.addEventListener("resize", ajustarAreaDoJogo);
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", ajustarAreaDoJogo);
      }
      ajustarAreaDoJogo();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/docs.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/docs.data.unityweb",
        frameworkUrl: buildUrl + "/docs.framework.js.unityweb",
        codeUrl: buildUrl + "/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Suricatus Games",
        productName: "Pacman Customizado",
        productVersion: "1.1",
        showBanner: unityShowBanner,
      };

      function mostrarErro(mensagem) {
        textoCarregando.textContent = "Não foi possível carregar o jogo.";
        textoErro.textContent = mensagem;
        barraCheia.style.width = "0%";
        textoPorcento.textContent = "";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          var porcento = Math.round(progress * 100);
          barraCheia.style.width = porcento + "%";
          textoPorcento.textContent = porcento + "%";
        }).then(function (unityInstance) {
          // Esconde depois do fade, senao a tela volta a receber os toques.
          telaCarregando.classList.add("pronto");
          setTimeout(function () { telaCarregando.style.display = "none"; }, 400);
          ajustarAreaDoJogo();
        }).catch(function (message) {
          mostrarErro(message);
        });
      };
      script.onerror = function () {
        mostrarErro("Verifique sua conexão e tente abrir a página de novo.");
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
